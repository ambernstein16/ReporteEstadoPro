name: Update Radar Estado Pro data

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Días hacia atrás para buscar licitaciones publicadas que sigan vigentes"
        required: false
        default: "21"
  schedule:
    - cron: "30 10 * * 1-5"  # 07:30 Chile aprox.; ajustar según horario de verano/invierno

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update active opportunities
        env:
          MERCADO_PUBLICO_TICKET: ${{ secrets.MERCADO_PUBLICO_TICKET }}
          INCLUDE_DEMO_ROWS: "true"
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '21' }}
        run: python dashboard/scripts/update_data_active.py
      - name: Generate HTML and PDF reports
        run: python dashboard/scripts/generate_reports.py
      - name: Generate data quality report
        run: python dashboard/scripts/validate_data_quality.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/oportunidades_demo.json reports
          git diff --cached --quiet || git commit -m "Update active Mercado Publico opportunities, reports and QA"
          git push
